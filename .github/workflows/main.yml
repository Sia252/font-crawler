name: Font Crawler Scheduler

on:
  schedule:
    # 매일 한국시간 자정(밤 12시)에 실행 (UTC 기준 15:00)
    - cron: '0 15 * * *'
  workflow_dispatch: # 수동으로 즉시 실행할 수 있는 버튼 추가

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 2. 파이썬 환경 설정 (Python 3.10)
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 필요한 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 파이썬 크롤러 실행 (데이터 수집 및 Make.com 전송)
      run: |
        python fonts_crawler.py
